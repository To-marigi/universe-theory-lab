[project]
name = "universe-theory-lab"
version = "0.1.0"
description = "Reproducible symbolic and numerical research environment for fundamental physics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=7.0,<8",
    "dask[array]>=2025.1",
    "einsteinpy>=0.4,<0.5",
    "gmpy2>=2.2,<3",
    "h5py>=3.12,<4",
    "ipywidgets>=8.1,<9",
    "joblib>=1.4,<2",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.10,<4",
    "mpmath>=1.3,<2",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "networkx>=3.4,<4",
    "numba>=0.61,<0.63",
    "numexpr>=2.10,<3",
    "numpy>=2.1,<2.4",
    "opt-einsum>=3.4,<4",
    "pandas>=2.2,<3",
    "pint>=0.24,<0.26",
    "plotly>=6.0,<7",
    "psutil>=6.1,<8",
    "python-flint>=0.7,<0.9",
    "qutip>=5.1,<6",
    "rich>=13.9,<15",
    "scipy>=1.15,<2",
    "symengine>=0.13,<0.15",
    "sympy>=1.14,<2",
    "tqdm>=4.67,<5",
    "xarray>=2025.1",
    "zarr>=3.0,<4",
]

[project.scripts]
qgbench = "universe_lab.qgbench.cli:main"
stringbench = "universe_lab.stringbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6.0,<8",
    "ruff>=0.9,<0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_lab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/universe_lab/stringbench", "src/universe_lab/qgaudit"]
