name: CI

# Portable verification path only. The exact SageMath/Singular reruns are not
# executed here: they need the container defined in compose.yaml and a
# human-owned resource budget (see config/*_budget.json). The committed
# certificates under results/ are what the tests below check against.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history is required, not optional. The baseline audits in
      # audit_v03.py and audit_v031.py verify the v0.2 and v0.3 freeze
      # boundaries with `git cat-file`, `git merge-base --is-ancestor`, a
      # `rev-parse` of each annotated freeze tag, and a resolution of the frozen
      # v0.3 branch. A shallow checkout has none of those objects, so
      # ENGINEERING_STATUS becomes ENGINEERING_FAIL and five tests fail
      # (run 30542047343).
      #
      # Three refs must exist on origin for those objects to be fetchable: the
      # annotated tags final-theory-bench-v0.2-dynamics-final-theory-open and
      # final-theory-bench-v0.3-novelty-first-open, and the frozen branch
      # codex/final-theory-v0.3-novelty-first-20260728. V031_BRANCH is recorded
      # as metadata only and is not resolved, so it is not required.
      #
      # Since v0.3.9 no step materialises a local head for the frozen branch:
      # audit_v031.resolve_frozen_branch accepts the remote-tracking ref that
      # every clone already has. tests/final_theory/test_audit_ref_portability_v039.py
      # pins that behaviour, so removing this workaround cannot regress silently.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin interpreter
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      # The current branch is a v0.4 research tree. Historical raw-byte
      # release verification is intentionally run only in historical-v0.3.9
      # below, at the exact public source commit. Running reproduce_v039.py on
      # this tree would correctly reject the newer reference catalogue.
      - name: Verify v0.4 current result
        run: uv run python scripts/reproduce_v04.py

      - name: Pytest
        run: |
          uv run pytest -ra \
            --ignore=tests/final_theory/test_reproduce_v037.py \
            --ignore=tests/final_theory/test_line_ending_bridge_v038.py \
            --ignore=tests/final_theory/test_reproduce_v038.py \
            --ignore=tests/final_theory/test_reproduce_v039.py

  historical-v039:
    name: frozen v0.3.9 release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Zenodo v0.3.9 record 21720863 names this exact source commit. The
      # v0.3.8 line-ending bridge and v0.3.9 release manifest are historical
      # raw-byte contracts, so they must be verified in this checkout rather
      # than regenerated or reinterpreted on the current v0.4 tree.
      - uses: actions/checkout@v4
        with:
          ref: cba86eae795e1e985c4ba1bcd3dabe4eb2773fab
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin interpreter
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify frozen v0.3.9 release
        run: uv run python scripts/reproduce_v039.py

      - name: Historical release-boundary tests
        run: |
          uv run pytest -ra \
            tests/final_theory/test_reproduce_v037.py \
            tests/final_theory/test_line_ending_bridge_v038.py \
            tests/final_theory/test_reproduce_v038.py \
            tests/final_theory/test_reproduce_v039.py

  types:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory on purpose. As of 2026-07-30 `uv run mypy` reports 11 errors,
    # all in src/universe_lab/final_theory/d2_sage_backend_v035.py:
    # two bytes|str assignments, one shadowed name, three unused type-ignore
    # comments, one missing annotation, and four platform-conditional
    # resource.getrusage/RUSAGE_SELF attribute errors. The v0.3.8 migration
    # changes only that file's text-output newline handling; it does not alter
    # solver semantics or clear the existing typing debt. Clearing these
    # errors is tracked separately and must be accompanied by a full test
    # rerun.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin interpreter
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy
