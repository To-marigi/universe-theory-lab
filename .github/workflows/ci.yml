name: CI

# Portable verification path only. The exact SageMath/Singular reruns are not
# executed here: they need the container defined in compose.yaml and a
# human-owned resource budget (see config/*_budget.json). The committed
# certificates under results/ are what the tests below check against.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history, tags and branches are required, not optional. The
      # baseline audits in audit_v03.py and audit_v031.py verify the v0.2 and
      # v0.3 freeze boundaries with `git cat-file`, `git merge-base
      # --is-ancestor`, a `rev-parse` of the annotated freeze tag, and a
      # `rev-parse` of the frozen v0.3 branch. A shallow checkout has none of
      # those objects, so ENGINEERING_STATUS becomes ENGINEERING_FAIL and five
      # tests fail (run 30542047343):
      #   test_audit_v03.py::test_v02_baseline_commit_tag_and_hashes_remain_frozen
      #   test_audit_v031.py::test_v03_baseline_is_immutable
      #   test_v03.py::test_novelty_first_status_axes_remain_independent
      #   test_v03.py::test_v02_baseline_is_still_hash_locked
      #   test_v031.py::test_v031_gate_statuses_and_claim_ceiling
      # Three refs must also exist on origin for those objects to be
      # fetchable at all: the two annotated freeze tags
      # final-theory-bench-v0.2-dynamics-final-theory-open and
      # final-theory-bench-v0.3-novelty-first-open, and the frozen branch
      # codex/final-theory-v0.3-novelty-first-20260728. V031_BRANCH is only
      # recorded as metadata and is not resolved, so it is not required.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin interpreter
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Verify v0.3.8 canonical-LF release
        run: uv run python scripts/reproduce_v038.py

      - name: Pytest
        run: uv run pytest -ra

  types:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory on purpose. As of 2026-07-30 `uv run mypy` reports 11 errors,
    # all in src/universe_lab/final_theory/d2_sage_backend_v035.py:
    # two bytes|str assignments, one shadowed name, three unused type-ignore
    # comments, one missing annotation, and four platform-conditional
    # resource.getrusage/RUSAGE_SELF attribute errors. The v0.3.8 migration
    # changes only that file's text-output newline handling; it does not alter
    # solver semantics or clear the existing typing debt. Clearing these
    # errors is tracked separately and must be accompanied by a full test
    # rerun.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin interpreter
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy
